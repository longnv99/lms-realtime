name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: shared
            commands: |
              npm run typecheck:shared
              npm run build:shared
          - workspace: backend
            commands: |
              npm run typecheck:backend
              npm run lint --workspace=backend
              npm run test:backend
              npm run build:backend
          - workspace: frontend
            commands: |
              npm run typecheck:frontend
              npm run lint --workspace=frontend
              npm run test:frontend
              npm run build:frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ${{ matrix.commands }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f backend/Dockerfile -t lms-backend:ci .
      - run: docker build -f frontend/Dockerfile -t lms-frontend:ci .

  e2e:
    runs-on: ubuntu-latest
    needs:
      - quality
      - docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose --env-file .env.prod.example -f docker-compose.prod.yml up -d --build
      - run: npm run db:seed:prod
      - run: npm run test:e2e:prod
      - if: always()
        run: docker compose --env-file .env.prod.example -f docker-compose.prod.yml logs
      - if: always()
        run: docker compose --env-file .env.prod.example -f docker-compose.prod.yml down -v
